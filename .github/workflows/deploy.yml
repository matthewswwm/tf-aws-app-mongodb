name: Build, Scan & Deploy Tasky

on:
  push:
    branches: [main]
    paths:
      - 'tasky-main/**'
      - 'k8s/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

env:
  REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

permissions:
  contents: read

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./tasky-main
          push: false
          load: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY_IMAGE }}:latest

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Push image
        run: |
          docker push ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.tag }}
          docker push ${{ env.REGISTRY_IMAGE }}:latest

  deploy:
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ env.EKS_CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}"

      - name: K8s deploy
        run: |
          kubectl apply -f k8s/namespace.yaml

          kubectl create secret generic tasky-env-secrets -n tasky \
            --from-literal=MONGODB_URI="mongodb://${{ secrets.MONGO_TASKY_USERNAME }}:${{ secrets.MONGO_TASKY_PASSWORD }}@${{ vars.MONGO_PRIVATE_IP }}:27017/admin" \
            --from-literal=SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/clusterrolebinding.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress-class.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Roll out latest image
        run: |
          kubectl rollout restart deployment/tasky -n tasky
          kubectl rollout status deployment/tasky -n tasky --timeout=120s
